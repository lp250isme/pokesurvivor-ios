name: PokeSurvivor
options:
  bundleIdPrefix: me.kvcc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "6"
targets:
  PokeSurvivor:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: PokéSurvivor
        CFBundleName: PokeSurvivor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.games
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
            UIPrerenderedIcon: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.kvcc.pokesurvivor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ENABLE_TESTABILITY: YES
        MARKETING_VERSION: "1.0.5"
        CURRENT_PROJECT_VERSION: "6"
    postBuildScripts:
      - name: Stamp iPhone Duo full screen
        basedOnDependencyAnalysis: false
        script: |
          bash "${SRCROOT}/scripts/stamp-duo-sdk.sh"
  PokeSurvivorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PokeSurvivor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.kvcc.pokesurvivor.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  PokeSurvivor:
    build:
      targets:
        PokeSurvivor: all
    test:
      targets:
        - PokeSurvivorTests
